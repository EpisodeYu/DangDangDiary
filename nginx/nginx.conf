events {}

http {
  # [DEBUG-2026-04-22] extended access log: the default combined format
  # doesn't tell us whether a slow request was spent on the phone->nginx
  # hop (request_time >> upstream_response_time) or inside FastAPI
  # (upstream_response_time high) or in the upload body (request_time
  # big but upstream_response_time tiny). `$body_bytes_sent` is the
  # response body length; `$request_length` is total bytes received
  # from the client including headers.
  log_format dbgtimed '$remote_addr - - [$time_local] "$request" '
                     '$status $body_bytes_sent req_len=$request_length '
                     'rt=$request_time uprt=$upstream_response_time '
                     'uct=$upstream_connect_time '
                     '"$http_user_agent"';
  access_log /var/log/nginx/access.log dbgtimed;

  server {
    listen 80;
    client_max_body_size 20m;

    # 2026-05-27：用 docker 内嵌 DNS(127.0.0.11) + 变量式 proxy_pass，让 nginx
    # 每次请求重新解析上游容器 IP。否则 minio / fastapi 一旦 recreate 换了 IP，
    # nginx 仍连启动时缓存的旧 IP → 502，需手动 restart nginx。变量式 proxy_pass
    # 不会自动改写 URI，故 /media/ 需手动 rewrite 剥前缀（见下）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fastapi_up fastapi:8000;
    set $minio_up   minio:9000;

    location /api/ {
      proxy_pass http://$fastapi_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /docs {
      proxy_pass http://$fastapi_up;
      proxy_set_header Host $host;
    }

    location /openapi.json {
      proxy_pass http://$fastapi_up;
      proxy_set_header Host $host;
    }

    location /media/ {
      # 变量式 proxy_pass 不会自动改写 URI，这里手动剥掉 /media/ 前缀，
      # 等价于原 `proxy_pass http://minio:9000/;`（剥前缀 + 保留 query string）。
      rewrite ^/media/(.*)$ /$1 break;
      proxy_pass http://$minio_up;
      # 必须与后端 MINIO_ENDPOINT 一致：原图/语音是 host-signed 预签名 URL，
      # 签名 host=minio:9000，这里 Host 头要匹配，否则 SignatureDoesNotMatch(403)。
      proxy_set_header Host minio:9000;
    }
  }
}
